<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PI WEB</title>
    <!-- Palette tokens are applied pre-paint by the boot theme script injected
         at the top of <head> by the pi-web-boot-theme Vite plugin; the literals
         below are no-JS fallbacks only. -->
    <style>
      :root {
        --pi-control-font-size: 16px;
        --pi-control-font-family: system-ui, sans-serif;
        --pi-control-monospace-font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg, #1f1e1d); color: var(--pi-text, #ecebe7); }
      body { min-height: 100dvh; }
    </style>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
